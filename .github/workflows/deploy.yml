name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REACT_APP_GROQ_API_KEY: ${{ secrets.REACT_APP_GROQ_API_KEY }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Ensure API key is set for client bundle
      run: |
        if [ -z "${REACT_APP_GROQ_API_KEY:-}" ]; then
          echo "::error::REACT_APP_GROQ_API_KEY is empty. Add it under Settings → Secrets and variables → Actions → New repository secret (name must be exactly REACT_APP_GROQ_API_KEY)."
          exit 1
        fi
        case "${REACT_APP_GROQ_API_KEY}" in
          gsk_*) ;;
          *)
            echo "::error::REACT_APP_GROQ_API_KEY must be a valid Groq key (starts with gsk_). Create one at https://console.groq.com/"
            exit 1
            ;;
        esac
      
    - name: Build
      run: npm run build
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
